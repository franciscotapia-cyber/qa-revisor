<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Revisor — CFT San Agustín</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{--bg:#F7F6F3;--sur:#fff;--sur2:#F0EEE9;--bor:rgba(0,0,0,.08);--bors:rgba(0,0,0,.15);--t:#1A1917;--t2:#6B6760;--t3:#9E9B96;--pu:#534AB7;--pul:#EEEDFE;--pum:#7F77DD;--gr:#1D9E75;--grl:#E1F5EE;--am:#BA7517;--aml:#FAEEDA;--bl:#185FA5;--bll:#E6F1FB;--re:#A32D2D;--rel:#FCEBEB;--grl2:#F1EFE8;--r:10px;--rl:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t);font-size:14px;line-height:1.5;min-height:100vh;}
#setup{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;} 
  
.sc{background:var(--sur);border-radius:var(--rl);border:1px solid var(--bor);padding:2.5rem;max-width:460px;width:100%;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.slogo{display:flex;align-items:center;gap:10px;margin-bottom:2rem;}
.slogo-i{width:42px;height:42px;background:var(--pu);border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:21px;}
.slogo-t{font-size:15px;font-weight:600;}
.slogo-t span{display:block;font-size:12px;font-weight:400;color:var(--t2);}
.stitle{font-size:20px;font-weight:600;margin-bottom:6px;}
.ssub{font-size:13px;color:var(--t2);margin-bottom:1.5rem;line-height:1.6;}
.slbl{font-size:12px;font-weight:500;color:var(--t2);margin-bottom:6px;}
.srow{display:flex;gap:8px;margin-bottom:1rem;}
.sinput{flex:1;border:1px solid var(--bors);border-radius:var(--r);padding:10px 12px;font-family:'DM Mono',monospace;font-size:13px;background:var(--bg);color:var(--t);outline:none;}
.sinput:focus{border-color:var(--pum);}
.tbtn{padding:10px 14px;border:1px solid var(--bors);border-radius:var(--r);background:var(--sur2);color:var(--t2);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.tbtn:hover{background:var(--pul);color:var(--pu);}
.sbtn{width:100%;background:var(--pu);color:#fff;border:none;border-radius:var(--r);padding:11px;font-size:14px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.sbtn:hover{background:#3C3489;}
.sbtn:disabled{opacity:.5;cursor:not-allowed;}
.tres{border-radius:8px;padding:.65rem .85rem;font-size:12.5px;margin-bottom:.75rem;display:none;align-items:center;gap:8px;}
.tres.show{display:flex;}
.tres.ok{background:var(--grl);color:#085041;border:1px solid #9FE1CB;}
.tres.err{background:var(--rel);color:var(--re);border:1px solid #F09595;}
.tres.chk{background:var(--pul);color:var(--pu);border:1px solid var(--pum);}
.snote{margin-top:1rem;font-size:11px;color:var(--t3);text-align:center;line-height:1.7;}
.snote a{color:var(--pu);text-decoration:none;}
.spin{animation:sp 1s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg)}}
#app{display:none;height:100vh;overflow:hidden;}
.layout{display:grid;grid-template-columns:220px 1fr;height:100vh;}
.sidebar{background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;overflow:hidden;}
.sh{padding:1rem;border-bottom:1px solid var(--bor);flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;}
.bi{width:28px;height:28px;background:var(--pu);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0;}
.bn{font-size:13px;font-weight:600;line-height:1.2;}
.bn span{display:block;font-size:11px;font-weight:400;color:var(--t2);}
.snav{flex:1;overflow-y:auto;padding:.75rem;}
.nlbl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:0 .25rem;margin:.75rem 0 .3rem;}
.nlbl:first-child{margin-top:0;}
.ntab{width:100%;text-align:left;padding:7px 10px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:12.5px;font-family:'DM Sans',sans-serif;color:var(--t2);display:flex;align-items:center;gap:7px;margin-bottom:2px;font-weight:500;}
.ntab:hover{background:var(--sur2);color:var(--t);}
.ntab.active{background:var(--pul);color:var(--pu);}
.ntab.tab-ref.active{background:#FAEEDA;color:#633806;}
.ntab.tab-dash.active{background:#E6F1FB;color:#0C447C;}

/* ── DASHBOARD ── */
.dash-view-tabs{display:flex;gap:8px;margin-bottom:1.25rem;}
.dash-vtab{padding:6px 16px;border-radius:8px;border:1px solid var(--bors);background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--t2);font-family:'DM Sans',sans-serif;transition:all .12s;}
.dash-vtab:hover{background:var(--sur2);}
.dash-vtab.active{background:var(--bl);color:#fff;border-color:var(--bl);}
.dash-kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.dash-kpi{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rl);padding:1rem 1.1rem;position:relative;overflow:hidden;}
.dash-kpi-icon{position:absolute;right:12px;top:12px;font-size:22px;opacity:.12;}
.dash-kpi-label{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
.dash-kpi-val{font-size:28px;font-weight:600;line-height:1;margin-bottom:4px;}
.dash-kpi-sub{font-size:11px;color:var(--t3);}
.dash-kpi-bar{height:3px;border-radius:99px;background:var(--sur2);margin-top:8px;overflow:hidden;}
.dash-kpi-bar-fill{height:100%;border-radius:99px;transition:width .4s;}
.dash-section{font-size:13px;font-weight:600;color:var(--t2);margin:1.25rem 0 .75rem;display:flex;align-items:center;gap:7px;}
.dash-car-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:1.5rem;}
.dash-car-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rl);overflow:hidden;}
.dash-car-header{padding:.85rem 1rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bor);}
.dash-car-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.dash-car-name{font-size:13px;font-weight:600;flex:1;}
.dash-car-pct{font-size:20px;font-weight:600;}
.dash-car-body{padding:.85rem 1rem;}
.dash-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dash-bar-lbl{font-size:11px;color:var(--t2);width:80px;flex-shrink:0;}
.dash-bar-track{flex:1;height:7px;border-radius:99px;background:var(--sur2);overflow:hidden;}
.dash-bar-fill{height:100%;border-radius:99px;}
.dash-bar-num{font-size:11px;font-weight:500;color:var(--t2);width:30px;text-align:right;flex-shrink:0;}
.dash-ciclo-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:1.5rem;}
.dash-ciclo-table th{text-align:left;padding:6px 10px;font-size:11px;font-weight:600;color:var(--t2);border-bottom:1px solid var(--bor);background:var(--sur2);}
.dash-ciclo-table td{padding:7px 10px;border-bottom:0.5px solid var(--bor);vertical-align:middle;}
.dash-ciclo-table tr:last-child td{border-bottom:none;}
.dash-ciclo-table tr:hover td{background:var(--sur2);}
.dash-status-pill{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500;white-space:nowrap;display:inline-block;}
.dsp-v{background:var(--grl);color:#085041;}
.dsp-c{background:var(--aml);color:#633806;}
.dsp-r{background:var(--rel);color:var(--re);}
.dsp-p{background:var(--grl2);color:#444441;}
.dash-mini-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:1px;min-width:80px;}
.dash-mini-seg{height:100%;}
.dash-alert-box{background:var(--aml);border:1px solid #EF9F27;border-radius:10px;padding:.85rem 1rem;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:10px;}
.dash-alert-title{font-size:13px;font-weight:600;color:#633806;margin-bottom:4px;}
.dash-alert-list{font-size:12px;color:#854F0B;line-height:1.7;}
.dash-tiempo{background:var(--bll);border:1px solid #85B7EB;border-radius:10px;padding:.85rem 1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:12px;}
.dash-tiempo-icon{font-size:24px;color:var(--bl);flex-shrink:0;}
.dash-tiempo-title{font-size:13px;font-weight:600;color:#0C447C;}
.dash-tiempo-sub{font-size:12px;color:var(--bl);}
.dash-go-btn{font-size:11px;padding:3px 10px;border-radius:99px;border:1px solid var(--bors);background:transparent;cursor:pointer;color:var(--t2);font-family:'DM Sans',sans-serif;margin-left:auto;white-space:nowrap;}
.dash-go-btn:hover{background:var(--sur2);}
.ncar{width:100%;text-align:left;padding:6px 8px;border-radius:7px;border:none;background:transparent;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--t2);display:flex;align-items:center;gap:7px;margin-bottom:1px;}
.ncar:hover{background:var(--sur2);color:var(--t);}
.ncar.active{background:var(--pul);color:var(--pu);font-weight:500;}
.ndot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.cg{padding-left:14px;margin-bottom:2px;}
.ncic{width:100%;text-align:left;padding:4px 8px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--t3);margin-bottom:1px;}
.ncic:hover{background:var(--sur2);color:var(--t2);}
.ncic.active{background:var(--bll);color:var(--bl);font-weight:500;}
.sf{padding:.75rem 1rem;border-top:1px solid var(--bor);font-size:11px;color:var(--t3);display:flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;}
.sf:hover{background:var(--sur2);}
.adot{width:6px;height:6px;border-radius:50%;background:var(--gr);flex-shrink:0;}
.ma{display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--sur);border-bottom:1px solid var(--bor);padding:.75rem 1.25rem;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.tbtitle{font-size:14px;font-weight:600;flex:1;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:500;}
.cg2{background:var(--grl);color:#085041;}.ca{background:var(--aml);color:#633806;}.cb{background:var(--bll);color:var(--bl);}.cgr{background:var(--grl2);color:#444441;}
.content{flex:1;overflow-y:auto;padding:1.25rem;}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);text-align:center;gap:10px;}
.eicon{width:56px;height:56px;background:var(--pul);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--pu);margin-bottom:4px;}
.empty h2{font-size:15px;font-weight:500;color:var(--t2);}
.empty p{font-size:12px;color:var(--t3);max-width:280px;line-height:1.6;}
.mc{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rl);margin-bottom:.75rem;overflow:hidden;}
.mh{padding:.9rem 1rem;display:flex;align-items:center;gap:10px;cursor:pointer;}
.mh:hover{background:var(--sur2);}
.mi{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.mn{font-size:13.5px;font-weight:500;flex:1;}
.sbg{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap;}
.sv{background:var(--grl);color:#085041;}.sm{background:var(--aml);color:#633806;}.sr{background:var(--bll);color:var(--bl);}.sp2{background:var(--grl2);color:#5F5E5A;}
.chv{font-size:14px;color:var(--t3);transition:transform .2s;}
.chv.open{transform:rotate(180deg);}
.ss{border-top:1px solid var(--bor);padding:.75rem 1rem;}
.slbl2{font-size:11px;color:var(--t3);margin-bottom:8px;font-weight:500;}
.sgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
.sbtn2{border:1px solid var(--bors);border-radius:7px;padding:6px 3px;text-align:center;cursor:pointer;background:var(--bg);font-size:11px;font-weight:500;color:var(--t2);font-family:'DM Sans',sans-serif;}
.sbtn2:hover{border-color:var(--pum);color:var(--pu);background:var(--pul);}
.sbtn2.sel{border-color:var(--bl);background:var(--bll);color:var(--bl);}
.sbtn2.ok{background:var(--grl);border-color:#5DCAA5;color:#085041;}
.sbtn2.warn{background:var(--aml);border-color:#EF9F27;color:#633806;}
.sbtn2.err{background:var(--rel);border-color:#F09595;color:var(--re);}
.rp{border-top:1px solid var(--bor);padding:1rem;}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:.85rem;flex-wrap:wrap;}
.ptitle{font-size:13px;font-weight:600;flex:1;}
.biaall{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;background:var(--pu);color:#fff;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;}
.biaall:hover{background:#3C3489;}
.biaall:disabled{opacity:.6;cursor:not-allowed;}
.iapb{position:absolute;bottom:0;left:0;height:2px;background:rgba(255,255,255,.5);width:0%;transition:width .3s;}
.tpill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--grl);color:#085041;border:1px solid #9FE1CB;margin-bottom:.75rem;}
.refpill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;background:#FAEEDA;color:#633806;border:1px solid #EF9F27;margin-bottom:.75rem;margin-left:6px;}
.kitpill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--grl);color:#085041;border:1px solid #5DCAA5;margin-bottom:.75rem;margin-left:6px;}
.rlist{display:flex;flex-direction:column;gap:8px;}
.ri{border:1px solid var(--bor);border-radius:var(--r);background:var(--sur);overflow:hidden;}
.rtop{padding:.75rem .85rem;display:flex;align-items:center;gap:8px;cursor:pointer;}
.rtop:hover{background:var(--sur2);}
.ttag{font-size:10.5px;padding:2px 7px;border-radius:99px;white-space:nowrap;font-weight:500;}
.ti2{background:var(--bll);color:var(--bl);}.tp{background:var(--grl);color:#27500A;}.tv{background:var(--aml);color:#633806;}.tc{background:#FBEAF0;color:#72243E;}.tf{background:var(--grl2);color:#444441;}
.rname{font-size:13px;font-weight:500;flex:1;}
.spill{font-size:10px;padding:2px 7px;border-radius:99px;white-space:nowrap;}
.sok{background:var(--grl);color:#085041;border:1px solid #9FE1CB;}
.sno{background:var(--grl2);color:var(--t3);}
.ebs{display:flex;gap:3px;}
.eb{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bors);background:transparent;cursor:pointer;color:var(--t2);font-family:'DM Sans',sans-serif;}
.eb:hover{background:var(--sur2);}
.eb.ok{background:var(--grl);color:#085041;border-color:#5DCAA5;}
.eb.warn{background:var(--aml);color:#854F0B;border-color:#EF9F27;}
.eb.err{background:var(--rel);color:var(--re);border-color:#F09595;}
.xb{width:22px;height:22px;border-radius:6px;border:1px solid var(--bors);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t3);flex-shrink:0;}
.xb:hover{background:var(--sur2);}
.rbody{padding:.85rem;border-top:1px solid var(--bor);display:none;background:var(--bg);}
.rbody.open{display:block;}
.uzone{border:2px dashed var(--bors);border-radius:8px;padding:1.25rem;text-align:center;cursor:pointer;background:var(--sur);position:relative;}
.uzone:hover{border-color:var(--pum);background:var(--pul);}
.uzone.has{border-style:solid;border-color:#5DCAA5;background:var(--grl);}
.uzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.uthumb{max-width:100%;max-height:160px;border-radius:6px;margin-top:8px;border:1px solid var(--bor);}
.clrbtn{font-size:11px;color:var(--re);background:none;border:none;cursor:pointer;margin-top:5px;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:3px;}
.genbtn{width:100%;margin-top:.85rem;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:8px;border:none;background:var(--pu);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.genbtn:hover{background:#3C3489;}
.genbtn:disabled{opacity:.55;cursor:not-allowed;}
.sbox{border-radius:8px;padding:.65rem .85rem;font-size:12.5px;margin-top:8px;display:none;align-items:center;gap:8px;line-height:1.5;}
.sbox.show{display:flex;}
.sbox.wk{background:var(--pul);color:var(--pu);border:1px solid var(--pum);}
.sbox.gd{background:var(--grl);color:#085041;border:1px solid #9FE1CB;}
.sbox.bd{background:var(--rel);color:var(--re);border:1px solid #F09595;}
.clbl{font-size:11px;font-weight:500;color:var(--t2);margin-top:.85rem;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.carea{width:100%;font-size:12.5px;line-height:1.6;border:1px solid var(--bors);border-radius:7px;padding:7px 9px;background:var(--sur);color:var(--t);font-family:'DM Mono',monospace;resize:vertical;min-height:72px;outline:none;}
.carea:focus{border-color:var(--pum);}
.pacts{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--bor);}
.bsec{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:1px solid var(--bors);background:transparent;color:var(--t);font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.bsec:hover{background:var(--sur2);}
.bpri{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;border:none;background:var(--gr);color:#fff;font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;}
.bpri:hover{background:#0F6E56;}

/* ── REFERENCIAS ── */
.page-title{font-size:18px;font-weight:600;margin-bottom:6px;}
.page-sub{font-size:13px;color:var(--t2);line-height:1.6;margin-bottom:1.25rem;}
.ref-banner{background:var(--aml);border:1px solid #EF9F27;border-radius:10px;padding:1rem 1.25rem;display:flex;align-items:flex-start;gap:12px;margin-bottom:1.5rem;}
.ref-banner-icon{font-size:20px;color:#854F0B;flex-shrink:0;margin-top:2px;}
.ref-banner-title{font-size:13px;font-weight:600;color:#633806;margin-bottom:4px;}
.ref-banner-text{font-size:12px;color:#854F0B;line-height:1.6;}
.ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:2rem;}
.ref-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rl);overflow:hidden;}
.ref-ch{padding:.85rem 1rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bor);}
.ref-ci{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ref-ct{font-size:13px;font-weight:600;flex:1;}
.ref-cb{padding:1rem;}
.ref-desc{font-size:11px;color:var(--t3);margin-bottom:.75rem;line-height:1.5;}
.ref-uzone{border:2px dashed var(--bors);border-radius:8px;padding:1rem;text-align:center;cursor:pointer;background:var(--bg);position:relative;margin-bottom:.75rem;}
.ref-uzone:hover{border-color:var(--pum);background:var(--pul);}
.ref-uzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.ref-items{display:flex;flex-direction:column;gap:6px;}
.ref-item{background:var(--sur2);border-radius:7px;padding:.6rem .75rem;display:flex;align-items:flex-start;gap:8px;}
.ref-ithumb{width:36px;height:36px;border-radius:5px;object-fit:cover;border:1px solid var(--bor);flex-shrink:0;}
.ref-iicon{width:36px;height:36px;border-radius:5px;background:var(--rel);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--re);flex-shrink:0;}
.ref-iname{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── CÁLCULOS DE MÉTRICAS ── */
function calcMetricas(){
  /* Cuenta recursos totales y revisados por carrera/ciclo/módulo */
  var result={};
  CARRERAS.forEach(function(car){
    result[car.id]={name:car.name,short:car.short,color:car.color,ciclos:{}};
    for(var cic=1;cic<=6;cic++){
      var mods=MODULOS[car.id][cic]||[];
      result[car.id].ciclos[cic]={mods:[]};
      mods.forEach(function(mod,mi){
        var modData={name:mod,tipo:tipoModulo(mod),semanas:{}};
        /* Semana 0 + semanas 1-8 */
        [0,1,2,3,4,5,6,7,8].forEach(function(sem){
          var recs=getRecursosSem(sem);
          var semData={total:recs.length,ok:0,warn:0,err:0,pendiente:0};
          recs.forEach(function(r){
            var rv=ST.rev[rk(car.id,cic,mi,sem,r.id)]||{};
            if(rv.estado==="ok")semData.ok++;
            else if(rv.estado==="warn")semData.warn++;
            else if(rv.estado==="err")semData.err++;
            else semData.pendiente++;
          });
          modData.semanas[sem]=semData;
        });
        result[car.id].ciclos[cic].mods.push(modData);
      });
    }
  });
  return result;
}

function calcResumen(metricas){
  var tot=0,ok=0,warn=0,err=0,pend=0,semsCompletas=0,semsTot=0;
  CARRERAS.forEach(function(car){
    for(var cic=1;cic<=6;cic++){
      metricas[car.id].ciclos[cic].mods.forEach(function(mod){
        [0,1,2,3,4,5,6,7,8].forEach(function(sem){
          var s=mod.semanas[sem];
          tot+=s.total;ok+=s.ok;warn+=s.warn;err+=s.err;pend+=s.pendiente;
          semsTot++;
          if(s.total>0&&s.ok+s.warn+s.err===s.total)semsCompletas++;
        });
      });
    }
  });
  return{tot:tot,ok:ok,warn:warn,err:err,pend:pend,semsCompletas:semsCompletas,semsTot:semsTot};
}
function calcCarrera(metricas,carId){
  var tot=0,ok=0,warn=0,err=0,pend=0,semsCompletas=0,semsTot=0;
  for(var cic=1;cic<=6;cic++){
    metricas[carId].ciclos[cic].mods.forEach(function(mod){
      [0,1,2,3,4,5,6,7,8].forEach(function(sem){
        var s=mod.semanas[sem];
        tot+=s.total;ok+=s.ok;warn+=s.warn;err+=s.err;pend+=s.pendiente;
        semsTot++;
        if(s.total>0&&s.ok+s.warn+s.err===s.total)semsCompletas++;
      });
    });
  }
  return{tot:tot,ok:ok,warn:warn,err:err,pend:pend,semsCompletas:semsCompletas,semsTot:semsTot};
}
function calcCiclo(metricas,carId,cic){
  var tot=0,ok=0,warn=0,err=0,pend=0,semsCompletas=0,semsTot=0;
  metricas[carId].ciclos[cic].mods.forEach(function(mod){
    [0,1,2,3,4,5,6,7,8].forEach(function(sem){
      var s=mod.semanas[sem];
      tot+=s.total;ok+=s.ok;warn+=s.warn;err+=s.err;pend+=s.pendiente;
      semsTot++;
      if(s.total>0&&s.ok+s.warn+s.err===s.total)semsCompletas++;
    });
  });
  return{tot:tot,ok:ok,warn:warn,err:err,pend:pend,semsCompletas:semsCompletas,semsTot:semsTot};
}

function pct(n,d){return d===0?0:Math.round(n/d*100);}
function minBar(ok,warn,err,tot){
  var pw=pct(ok,tot),ww=pct(warn,tot),ew=pct(err,tot),pw2=100-pw-ww-ew;
  return '<div class="dash-mini-bar">'+
    (pw?'<div class="dash-mini-seg" style="width:'+pw+'%;background:#1D9E75"></div>':'')+
    (ww?'<div class="dash-mini-seg" style="width:'+ww+'%;background:#EF9F27"></div>':'')+
    (ew?'<div class="dash-mini-seg" style="width:'+ew+'%;background:#E24B4A"></div>':'')+
    (pw2>0?'<div class="dash-mini-seg" style="width:'+pw2+'%;background:var(--sur2)"></div>':'')+
  '</div>';
}

function tiempoEstimado(pend){
  /* Asumiendo ~3 min por recurso con IA */
  var mins=pend*3;
  if(mins<60)return mins+" min";
  var hrs=Math.floor(mins/60);var m=mins%60;
  return hrs+"h "+(m>0?m+"min":"");
}

function addRef(tipoId,input){
  var files=input.files;if(!files||!files.length)return;
  var count=0,total=files.length;
  function processFile(file){
    var isPdf=file.type==="application/pdf";
    if(isPdf){
      var kb=Math.round(file.size/1024);
      REFS[tipoId].push({id:Date.now()+"_"+Math.random(),name:file.name,b64:"",isPdf:true,desc:"",size:kb+"KB"});
      count++;if(count===total){saveRefs();renderReferencias();toast(count+" referencia(s) agregada(s)");}
    }else{
      var reader=new FileReader();
      reader.onload=function(e){
        var img=new Image();
        img.onload=function(){
          var canvas=document.createElement("canvas");var MAX=1200,w=img.width,h=img.height;
          if(w>MAX){h=Math.round(h*(MAX/w));w=MAX;}if(h>MAX){w=Math.round(w*(MAX/h));h=MAX;}
          canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
          var b64=canvas.toDataURL("image/jpeg",0.82);var kb=Math.round(b64.length*0.75/1024);
          REFS[tipoId].push({id:Date.now()+"_"+Math.random(),name:file.name,b64:b64,isPdf:false,desc:"",size:kb+"KB"});
          count++;if(count===total){saveRefs();renderReferencias();toast(count+" referencia(s) agregada(s)");}
        };img.src=e.target.result;
      };reader.readAsDataURL(file);
    }
  }
  for(var i=0;i<files.length;i++)processFile(files[i]);
}
function delRef(tipoId,idx){REFS[tipoId].splice(idx,1);saveRefs();renderReferencias();}
function saveRefDesc(tipoId,idx,val){if(REFS[tipoId]&&REFS[tipoId][idx])REFS[tipoId][idx].desc=val;saveRefs();}

function renderKit(){

  html+='<div class="page-sub">Define los elementos correctos para cada tipo de recurso. La IA usará todo esto como criterio al generar comentarios de revisión.</div>';
  html+='<div class="kit-tabs">';
  for(var i=0;i<KIT_RECURSOS.length;i++){
    var kr=KIT_RECURSOS[i];
    var kd=KIT[kr.id]||{};
    var filled=((kd.colores&&kd.colores.length>0)||(kd.fuentePrincipal)||(kd.notas))?'<span style="width:6px;height:6px;border-radius:50%;background:var(--gr);display:inline-block;margin-left:4px;"></span>':"";
    html+='<button class="kit-tab'+(ACTIVE_KIT===kr.id?" active":"")+'" onclick="setKitTab(\''+kr.id+'\')"><i class="ti '+kr.icon+'" style="font-size:13px"></i> '+kr.label+filled+'</button>';
  }
  html+='</div>';
  for(var ki=0;ki<KIT_RECURSOS.length;ki++){
    var kr2=KIT_RECURSOS[ki];

function setKitTab(id){ACTIVE_KIT=id;renderKit();}
function addColor(recursoId){
  var pick=document.getElementById("colorpick-"+recursoId);
  if(!pick)return;
  var col=pick.value;
  if(!KIT[recursoId])KIT[recursoId]={colores:[],tipografia:"",ilustraciones:[],iconos:[],notas:""};
  if(!KIT[recursoId].colores)KIT[recursoId].colores=[];
  KIT[recursoId].colores.push(col);
  saveKit();renderKit();
}
function delColor(recursoId,idx){KIT[recursoId].colores.splice(idx,1);saveKit();renderKit();}
function saveKitField(recursoId,field,val){if(!KIT[recursoId])KIT[recursoId]={};KIT[recursoId][field]=val;saveKit();}
function addKitImg(recursoId,campo,input){
  var files=input.files;if(!files||!files.length)return;
  if(!KIT[recursoId])KIT[recursoId]={};
  if(!KIT[recursoId][campo])KIT[recursoId][campo]=[];
  var count=0;
  function pf(file){
    var r=new FileReader();
    r.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement("canvas");var MAX=800,w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*(MAX/w));w=MAX;}if(h>MAX){w=Math.round(w*(MAX/h));h=MAX;}
        canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
        KIT[recursoId][campo].push(canvas.toDataURL("image/jpeg",0.8));
        count++;if(count===files.length){saveKit();renderKit();}
      };img.src=e.target.result;
    };r.readAsDataURL(file);
  }
  for(var i=0;i<files.length;i++)pf(files[i]);
}
function delKitImg(recursoId,campo,idx){KIT[recursoId][campo].splice(idx,1);saveKit();renderKit();}
function guardarKit(recursoId){saveKit();var st=document.getElementById("kitstatus-"+recursoId);if(st){st.style.display="inline";setTimeout(function(){st.style.display="none";},2500);}toast("Kit de marca guardado");}

  var base="Eres el revisor de recursos educativos del CFT San Agustín. Redactas comentarios del checklist QA para la consultora eTiza.\n\nESTILO:\n- Guiones: \"- \" al inicio de cada observación\n- Videos: \"- Comentarios generales:\" luego \"- Slide X,\"\n- PDF: número de figura/tabla/página\n- Verbos: rehacer, sacar, agregar, reemplazar, corregir, revisar\n- Sin problemas: \"- SIN COMENTARIOS\"\n- Sin introducción ni cierre.\n\nCRITERIOS BASE:\nINFOGRAFÍA: Logo CFT, colores institucionales, tipografía, diseño infográfico no plano.\nPDF: Cuadros de texto sin formato, figuras copiadas del guión DI, títulos justificados, tablas sin formato.\nVIDEO: Comentarios generales, animaciones de salida, personaje centrado, slide final cortado.\nCUESTIONARIO: Visualización de casos, ponderación, retroalimentación.\nFORO: Claridad de consigna y criterios.\n\nCON IMAGEN: Analiza visualmente, sé ESPECÍFICO.";

  var kitInfo="";
  if(kdata){
    if(kdata.colores&&kdata.colores.length>0)kitInfo+="\nColores institucionales: "+kdata.colores.join(", ");
    if(kdata.notasColor)kitInfo+="\nUso de colores: "+kdata.notasColor;
    if(kdata.fuentePrincipal)kitInfo+="\nFuente principal: "+kdata.fuentePrincipal;
    if(kdata.fuenteSecundaria)kitInfo+="\nFuente secundaria: "+kdata.fuenteSecundaria;

    if(kdata.estructuraLayout)kitInfo+="\nEstructura y layout: "+kdata.estructuraLayout;
    if(kdata.criteriosIlustracion)kitInfo+="\nCriterios ilustración: "+kdata.criteriosIlustracion;
    if(kdata.reglasIconos)kitInfo+="\nReglas iconos: "+kdata.reglasIconos;
    if(kdata.reglasDecorativo)kitInfo+="\nElementos decorativos: "+kdata.reglasDecorativo;
    /* Video */
    if(kdata.estructuraSlides)kitInfo+="\nEstructura de slides: "+kdata.estructuraSlides;
    if(kdata.animacionesEntrada)kitInfo+="\nAnimaciones de entrada: "+kdata.animacionesEntrada;
    if(kdata.animacionesSalida)kitInfo+="\nAnimaciones de salida: "+kdata.animacionesSalida;
    if(kdata.transiciones)kitInfo+="\nTransiciones entre slides: "+kdata.transiciones;
    if(kdata.reglasPersonaje)kitInfo+="\nReglas del personaje/avatar: "+kdata.reglasPersonaje;
    if(kdata.reglasAudio)kitInfo+="\nReglas de audio: "+kdata.reglasAudio;
    if(kdata.reglasLocucion)kitInfo+="\nCriterios de locución: "+kdata.reglasLocucion;
    if(kdata.reglasVideoBG)kitInfo+="\nVideos de fondo: "+kdata.reglasVideoBG;
    if(kdata.reglasLogo)kitInfo+="\nUso del logo: "+kdata.reglasLogo;
    /* PDF */
    if(kdata.estructuraDoc)kitInfo+="\nEstructura del documento: "+kdata.estructuraDoc;
    if(kdata.reglasTablad)kitInfo+="\nReglas de tablas: "+kdata.reglasTablad;
    if(kdata.reglasFiguras)kitInfo+="\nReglas de figuras: "+kdata.reglasFiguras;
    if(kdata.reglasCuadros)kitInfo+="\nCuadros de texto destacado: "+kdata.reglasCuadros;
    if(kdata.reglasEncabezado)kitInfo+="\nEncabezado y pie de página: "+kdata.reglasEncabezado;
    /* Genially */
    if(kdata.estructuraNav)kitInfo+="\nEstructura y navegación: "+kdata.estructuraNav;
    if(kdata.reglasInteractividad)kitInfo+="\nInteractividad y botones: "+kdata.reglasInteractividad;
    if(kdata.reglasResponsivo)kitInfo+="\nResponsividad: "+kdata.reglasResponsivo;
    if(kdata.reglasAccesibilidad)kitInfo+="\nAccesibilidad: "+kdata.reglasAccesibilidad;
    /* Común */
    if(kdata.notas)kitInfo+="\nCriterios adicionales: "+kdata.notas;
  }
  if(kitInfo)base+="\n\nKIT DE MARCA INSTITUCIONAL (aplica siempre al revisar):"+kitInfo;

function buildRefImgs(tipoRecurso){
  var refId=tipoRecurso==="Infografía"?"imagen":tipoRecurso==="PDF"?"pdf":"video";
  var refs=REFS[refId]||[];
  var content=[];
  for(var i=0;i<refs.length;i++){
    if(!refs[i].b64||refs[i].isPdf)continue;
    var b64=refs[i].b64.split(",")[1];
    var mime=refs[i].b64.indexOf("image/png")>=0?"image/png":"image/jpeg";
    content.push({type:"image",source:{type:"base64",media_type:mime,data:b64}});
    content.push({type:"text",text:"[Referencia "+(i+1)+(refs[i].desc?" — "+refs[i].desc:"")+"]"});
  }
  /* Imágenes del kit */
  var kitId=tipoRecurso==="Infografía"?"infografia":tipoRecurso==="PDF"?"pdf":tipoRecurso==="Video / Interactivo"?"video":"genially";
  var kdata=KIT[kitId]||{};
  var kitImgs=(kdata.ilustraciones||[]).concat(kdata.iconos||[]);
  for(var j=0;j<kitImgs.length&&j<4;j++){
    var b64k=kitImgs[j].split(",")[1];
    content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64k}});
    content.push({type:"text",text:"[Elemento del kit de marca institucional]"});
  }
  return content;
}

function buildMoodleContext(ky,tipo,md){
  if(!md||Object.keys(md).length===0)return "";
  var ctx="\n\nDATOS MOODLE (revisados directamente en la plataforma):\n";
  if(tipo==="Cuestionario"){
    if(md.ponderacion)ctx+="Ponderación: "+md.ponderacion+"\n";
    if(md.intentos)ctx+="Intentos permitidos: "+md.intentos+"\n";
    if(md.tiempo)ctx+="Tiempo límite: "+md.tiempo+"\n";
    if(md.metodo)ctx+="Método de calificación: "+md.metodo+"\n";
    if(md.tipoAct)ctx+="Tipo de actividad: "+md.tipoAct+"\n";
    if(md.baraja)ctx+="Baraja preguntas: "+md.baraja+"\n";
    if(md.numPreguntas)ctx+="N° de preguntas: "+md.numPreguntas+"\n";
    if(md.tiposPreg)ctx+="Tipos de pregunta: "+md.tiposPreg+"\n";
    var checks={visibilidad:"Visible para estudiantes",fechas:"Fechas OK",pasaNota:"Pasa nota",casos:"Visualiza casos",disponible:"Disponible en semana correcta",pregClaras:"Preguntas claras",pregAlineadas:"Alineadas al OA",sinAmbiguedad:"Sin ambigüedad",bancoBastante:"Banco suficiente",ortografia:"Sin errores ortográficos",pregNumero:"N° correcto",feedbackConfig:"Feedback configurado",feedbackCorrect:"Feedback correcto",feedbackIncorrect:"Feedback incorrecto",feedbackExplica:"Feedback explica",feedbackLink:"Feedback con referencia",feedbackActivo:"Feedback visible al alumno"};
    var ok=[],nok=[];
    Object.keys(checks).forEach(function(k){if(md[k])ok.push(checks[k]);else nok.push(checks[k]);});
    if(nok.length>0)ctx+="Items NO cumplidos: "+nok.join(", ")+"\n";
    if(ok.length>0)ctx+="Items cumplidos: "+ok.join(", ")+"\n";
    if(md.obsConfig)ctx+="Obs. configuración: "+md.obsConfig+"\n";
    if(md.obsPreguntas)ctx+="Obs. preguntas: "+md.obsPreguntas+"\n";
    if(md.obsFeedback)ctx+="Obs. retroalimentación: "+md.obsFeedback+"\n";
  }else if(tipo==="Foro"){
    if(md.tipoForo)ctx+="Tipo de foro: "+md.tipoForo+"\n";
    if(md.ponderacion)ctx+="Ponderación: "+md.ponderacion+"\n";
    if(md.minRespuestas)ctx+="Mínimo de respuestas: "+md.minRespuestas+"\n";
    if(md.plazo)ctx+="Plazo: "+md.plazo+"\n";
    if(md.consignaTexto)ctx+="Texto de la consigna: \""+md.consignaTexto+"\"\n";
    var fchecks={consignaClaras:"Consigna clara",consignaAlineada:"Alineada a la semana",consignaReflexion:"Invita a reflexión",criteriosDefinidos:"Criterios definidos",visible:"Visible",rublicaConfig:"Rúbrica configurada"};
    var fnok=[];Object.keys(fchecks).forEach(function(k){if(!md[k])fnok.push(fchecks[k]);});
    if(fnok.length>0)ctx+="Items NO cumplidos: "+fnok.join(", ")+"\n";
    if(md.obsForo)ctx+="Observaciones: "+md.obsForo+"\n";
  }
  return ctx;
}
async function claudeCall(system,messages){
  try{
    var res=await fetch("/api/proxy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,system:system,messages:messages})});
    var txt=await res.text();
    var d;try{d=JSON.parse(txt);}catch(e){throw new Error("El servidor devolvió HTML en vez de JSON. Código HTTP: "+res.status+". Respuesta: "+txt.substring(0,200));}
    if(d.error)throw new Error(d.error.message||d.error.type||JSON.stringify(d.error));
    var t=d.content&&d.content.find(function(c){return c.type==="text";});
    if(!t)throw new Error("Respuesta vacía de Anthropic. Contenido: "+JSON.stringify(d).substring(0,200));
    return t.text;
  }catch(e){
    throw new Error(e.message||"Error desconocido al conectar con el proxy");
  }
}

function loadImg(ky,input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var canvas=document.createElement("canvas");var MAX=1400,w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*(MAX/w));w=MAX;}if(h>MAX){w=Math.round(w*(MAX/h));h=MAX;}
      canvas.width=w;canvas.height=h;canvas.getContext("2d").drawImage(img,0,0,w,h);
      ST.imgs[ky]=canvas.toDataURL("image/jpeg",0.82);
      renderContent();toast("Imagen cargada");
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function loadFile(ky,input){
  var file=input.files[0];if(!file)return;

    var reader=new FileReader();
    reader.onload=function(e){
      var b64=e.target.result;
      var kb=Math.round(file.size/1024);
      ST.pdfs[ky]={name:file.name,b64:b64,size:kb+"KB"};
      delete ST.imgs[ky];
      savePdfs();renderContent();toast("PDF cargado: "+file.name);
    };reader.readAsDataURL(file);
  }else{
    loadImg(ky,input);
    if(ST.pdfs[ky]){delete ST.pdfs[ky];savePdfs();}
  }
}

async function generarUno(btn){

  var hasImg=!!(ST.imgs[ky]);var hasPdf=!!(ST.pdfs[ky]);var refImgs=buildRefImgs(r.tipo);var hasRefs=refImgs.length>0;

    var pdfData=ST.pdfs[ky].b64.split(",")[1];
    var content=[];

    content.push({type:"document",source:{type:"base64",media_type:"application/pdf",data:pdfData}});
    content.push({type:"text",text:(hasRefs?"Compara este documento PDF con las referencias y el kit de marca. ":"Analiza este documento PDF y ")+"Genera el comentario QA.\n"+contexto});

    var content=refImgs.slice();content.push({type:"text",text:"--- RECURSO A REVISAR ---"});
    content.push({type:"image",source:{type:"base64",media_type:mime,data:b64}});
    content.push({type:"text",text:"Compara este recurso con las referencias y el kit de marca. Genera el comentario QA.\n"+contexto});
    messages=[{role:"user",content:content}];
  }else if(hasImg){
    setSbox(ky,"wk",'<span class="spin"><i class="ti ti-loader"></i></span> Analizando imagen...');
    var b642=ST.imgs[ky].split(",")[1];var mime2=ST.imgs[ky].indexOf("image/png")>=0?"image/png":"image/jpeg";
    messages=[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mime2,data:b642}},{type:"text",text:"Analiza visualmente y genera el comentario QA.\n"+contexto}]}];
  }else if(hasRefs){
    setSbox(ky,"wk",'<span class="spin"><i class="ti ti-loader"></i></span> Generando con referencias...');
    var content2=refImgs.slice();content2.push({type:"text",text:"Usando estas referencias como est\u00e1ndar, genera el comentario QA para:\n"+contexto});

/* ── EXPORTAR EXCEL (sin librería externa) ── */
function exportarExcel(){
  /* Agrupar revisiones por carrera + ciclo + asignatura */
  var hojas={};
  var keys=Object.keys(ST.rev);
  var totalRows=0;

  for(var i=0;i<keys.length;i++){
    var ky=keys[i];var rv=ST.rev[ky];
    if(!rv||(!rv.estado&&!rv.comentario))continue;
    var p=ky.split("_");
    var carId=p[0],cic=parseInt(p[1]),modIdx=parseInt(p[2]),sem=parseInt(p[3]),recId=p[4];
    var carObj=null;for(var j=0;j<CARRERAS.length;j++){if(CARRERAS[j].id===carId)carObj=CARRERAS[j];}
    var modNom=(MODULOS[carId]&&MODULOS[carId][cic])?MODULOS[carId][cic][modIdx]:"";
    var recsForSem=getRecursosSem(sem);
    var recObj=null;for(var j2=0;j2<recsForSem.length;j2++){if(recsForSem[j2].id===recId)recObj=recsForSem[j2];}
    var val=rv.estado==="ok"?"Validado":"No validado";
    var carNom=carObj?carObj.name:"";

    /* Clave de hoja: Ciclo N - NombreAsignatura (máx 28 chars para Excel) */
    var hojaKey=carId+"_"+cic+"_"+modIdx;
    var hojaLabel="Ciclo "+cic+" - "+modNom.substring(0,25);
    if(!hojas[hojaKey]){
      hojas[hojaKey]={
        label:hojaLabel,
        carNom:carNom,
        modNom:modNom,
        cic:cic,
        rows:[]
      };
    }
    hojas[hojaKey].rows.push([
      carNom, cic+".0", modNom, sem+".0",
      recObj?recObj.name:"", rv.comentario||"",
      "No aplicados","",val
    ]);
    totalRows++;
  }

  if(totalRows===0){toast("No hay revisiones para exportar");return;}

  /* Ordenar hojas por ciclo y luego por módulo */
  var hojasOrdenadas=Object.keys(hojas).sort(function(a,b){
    var ha=hojas[a],hb=hojas[b];
    if(ha.cic!==hb.cic)return ha.cic-hb.cic;
    return ha.modNom.localeCompare(hb.modNom);
  });

  /* Generar ZIP con un CSV por asignatura usando BlobWriter manual */
  /* Como no tenemos xlsx disponible de forma fiable, generamos CSVs separados */
  /* Si hay múltiples hojas, exportamos un CSV por hoja en archivos separados */
  var cantHojas=hojasOrdenadas.length;

  if(cantHojas===1){
    /* Un solo CSV */
    var hk=hojasOrdenadas[0];
    var h=hojas[hk];
    exportarCSV(h,hk);
    toast("Checklist exportado — "+h.label);
  } else {
    /* Múltiples asignaturas — exportar una por una con delay */
    toast("Exportando "+cantHojas+" archivos (uno por asignatura)...");
    for(var hi=0;hi<hojasOrdenadas.length;hi++){
      (function(idx){
        setTimeout(function(){
          var hk2=hojasOrdenadas[idx];
          var h2=hojas[hk2];
          exportarCSV(h2,hk2);
        }, idx*600);
      })(hi);
    }
  }
}

function exportarCSV(hoja,key){
  var HEADER=["Nombre de la Carrera","Ciclo","Asignatura","Semana","Recurso","Observaciones CFT","Cambios aplicados eTiza","Plataforma","Validación CFT"];
  /* Encabezado de 3 filas igual al formato real */
  var meta=[
    [hoja.carNom,"","","","","","","",""],
    [hoja.modNom,"","","","","","","",""],
    ["Módulo en sede online","Link","","","","","","",""],
    HEADER
  ];
  /* Ordenar filas por semana y luego por orden de recurso */
  hoja.rows.sort(function(a,b){
    var sa=parseFloat(a[3]),sb=parseFloat(b[3]);
    return sa-sb;
  });
  var allRows=meta.concat(hoja.rows);
  var csv=allRows.map(function(row){
    return row.map(function(cell){
      var s=String(cell==null?"":cell).replace(/"/g,'""');
      if(s.indexOf(",")>=0||s.indexOf("\n")>=0||s.indexOf('"')>=0)s='"'+s+'"';
      return s;
    }).join(",");
  }).join("\r\n");

  var BOM="\uFEFF";
  var blob=new Blob([BOM+csv],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  /* Nombre de archivo: QA_Ciclo3_TICS_2025-05-10.csv */
  var modShort=hoja.modNom.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ\s]/g,"").replace(/\s+/g,"_").substring(0,30);
  a.download="QA_Ciclo"+hoja.cic+"_"+modShort+"_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
}
